schema_version = 1
id = "mallee"
name = "Mallee"
description = "Native Windows command center for local application projects."

[project]
working_directory = "."

[logs]
sources = ["%LOCALAPPDATA%/Mallee/logs/Mallee.jsonl"]
open_with_deebugee = true

[artifacts]
paths = ["target/release/mallee-desktop.exe", "target/release/mallee.exe"]

[[actions]]
id = "start-desktop"
label = "Start Desktop"
program = "pnpm"
args = ["--dir", "apps/desktop", "tauri", "dev"]
kind = "long_running"
terminal = "captured"
concurrency = "replace_same_action"

[[actions]]
id = "check-workspace"
label = "Check Workspace"
program = "cargo"
args = ["check", "--workspace"]
kind = "task"
terminal = "captured"

[[actions]]
id = "test-workspace"
label = "Test Workspace"
program = "cargo"
args = ["test", "--workspace"]
kind = "task"
terminal = "captured"

[[actions]]
id = "build-desktop"
label = "Build Desktop"
program = "pwsh"
args = ["-NoLogo", "-NoProfile", "-File", ".mallee/scripts/build-desktop.ps1"]
kind = "task"
terminal = "captured"
confirm = true

[[actions]]
id = "open-project-folder"
label = "Open Project Folder"
operation = "open_project_folder"
kind = "task"
terminal = "captured"

[[actions]]
id = "open-log-folder"
label = "Open Log Folder"
operation = "open_log_folder"
kind = "task"
terminal = "captured"
